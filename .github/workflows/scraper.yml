name: Video Botu Calistir

on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir otomatik çalışır
  workflow_dispatch:       # İstediğiniz zaman GitHub üzerinden manuel çalıştırma butonu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Pages ve repoya yazma izni

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Yukle
        run: |
          pip install requests beautifulsoup4

      - name: Scraper'ı Calistir
        run: |
          python scraper.py

      - name: Degisiklikleri Kaydet ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Otomatik film listesi güncellendi" || exit 0
          git push
